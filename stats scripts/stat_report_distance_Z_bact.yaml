# =============================================================================
# stat_report_distance_Z — erreur de position et intensité en fonction de Z
# Lancer : python stats/stat_report_distance_Z.py stats/stat_report_distance_Z.yaml
#
# Pour chaque orientation et chaque Z : un hologramme simulé contenant UNE bactérie,
# puis la détection HOLOTRACKER, puis l'appariement avec la bactérie simulée.
#
# Tous les paramètres sont obligatoires. Nombres : notation scientifique acceptée.
# Repère : x, y = ceux de l'image analysée (x = colonne, y = ligne, comme HOLOTRACKER) ;
#          Z = distance du centre de la bactérie à l'hologramme.
#
# Durée : ~5 s par hologramme avec 401 plans reconstruits en 1024² (GPU 6 Go).
# Réglage par défaut : 3 orientations × 201 Z × 1 répétition = 603 hologrammes ≈ 50 min.
# Pour un essai rapide : z_step_um: 20, ou nb_planes plus petit avec un Z max réduit.
# =============================================================================

sweep:
  # Balayage de Z (µm) : de z_start_um à z_stop_um inclus, par pas de z_step_um. Réels, pas > 0.
  z_start_um: 5
  z_stop_um: 200
  z_step_um: 10
  # Orientations φ (°) : angle entre l'axe de la bactérie et l'axe optique.
  #   0 = bactérie alignée avec l'axe optique, 90 = bactérie couchée. Liste de réels dans [0, 90].
  orientations_phi_deg: [0, 45, 90]

bacterium:
  # Taille de la bactérie (µm). Réels > 0. Longueur totale, extrémités hémisphériques comprises.
  length_um: 2.0
  thickness_um: 0.8
  # Position latérale du centre (µm), repère de l'image. Réels dans [0, champ[ ;
  #   champ = holo_size × pixel_size_um / magnification (179,2 µm par défaut). Centre : 89,6.
  x_um: 89.6
  y_um: 89.6
  # Plan d'inclinaison de la bactérie (quand φ > 0) :
  #   xz : penchée vers l'axe x de l'image ; yz : penchée vers l'axe y.
  tilt_plane: xz

simulation:
  # Taille de l'hologramme (px). Entier > 0 (256, 512, 1024, 2048...).
  holo_size: 1024
  # Bordure de calcul autour de l'hologramme (px), avec apodisation sur sa moitié extérieure.
  #   Entier >= 0. 512 recommandé en 1024² (voir le simulateur).
  border: 512
  # Sur-échantillonnage XY du masque de la bactérie avant moyennage (anti-crénelage). Entier >= 1.
  upscale_factor: 2
  # Caméra et optique.
  pixel_size_um: 7.0        # pixel du capteur (µm). Réel > 0.
  magnification: 40         # grossissement. Réel > 0. Pixel côté objet = pixel_size_um / magnification.
  wavelength_nm: 660        # longueur d'onde dans le vide (nm). Réel > 0.
  index_medium: 1.33        # indice du milieu. Réel >= 1.
  index_object: 1.335      # indice de l'objet (bactérie). Réel. Déphasage par tranche = 2π·dz·Δn/λ.
  # Absorption de l'objet : % d'intensité perdus par micromètre de matière traversée.
  #   Réel dans [0, 100[. Après un trajet de L µm dans l'objet, il reste (1 − %/100)^L.
  #     0    objet transparent, purement déphasant (cas de la bactérie dans l'eau)
  #     10   il reste 90 % après 1 µm, 59 % après 5 µm
  #     50   il reste 50 % après 1 µm, 3 % après 5 µm
  #     99   quasi opaque : il reste 1 % après 1 µm
  absorption_percent_per_um: 0.0
  # Pas des tranches traversées par la bactérie (µm). Réel > 0. Simulateur : 0,5.
  sim_step_um: 0.5
  # Distance à l'hologramme où part l'illumination = face lointaine de l'échantillon (µm).
  #   Réel > Z max + longueur / 2. Le simulateur part de z_size·dz + distance volume-caméra.
  illumination_distance_um: 210
  # Amplitude de l'illumination (onde plane, sans bruit : le fond fixe réel est retiré par la
  #   division par la moyenne du film ; seul le bruit du capteur est simulé, voir sensor_noise_std_*).
  illumination_mean: 1.0
  # Hologramme de référence = moyenne de N images du film (sans objet) : le bruit
  #   du capteur y est réduit à σ/√N. Entier >= 1.
  reference_nb_planes: 16
  # Bruit du capteur : gaussien, ajouté à l'intensité de l'hologramme APRÈS propagation (et à chacune
  #   des images de la référence). Écart-type relatif au fond, tiré dans [min, max] pour chaque
  #   hologramme. Mesuré sur le film réel : 0,015. Réels >= 0 ; 0 = pas de bruit.
  sensor_noise_std_min: 0.015
  sensor_noise_std_max: 0.015
  # Direction de l'illumination (°) : azimut et angle polaire (0, 0 = éclairage droit).
  source_azimuth_deg: 0
  source_polar_deg: 0

detection:
  # Chaîne HOLOTRACKER (mêmes paramètres que stats/GUI_holo_stats.py).
  # Nettoyage par l'hologramme de référence : division | subtraction | none
  cleaning: subtraction
  # Puissance après division (ignorée sinon). Réel > 0. HOLOTRACKER : 0.8.
  division_power: 0.8
  # Plans reconstruits : de distance_ini_um, nb_planes plans, pas step_um.
  #   Doit couvrir le balayage Z : ici 0 → 200 µm. Mémoire GPU : nb_planes × holo_size² × 4 octets
  #   (401 plans en 1024² = 1,6 Go, plus ~2 Go de travail pour la détection).
  distance_ini_um: 0
  nb_planes: 401
  step_um: 0.5
  # Filtre spectral : rayons min et max conservés (px de fréquence). Entiers >= 0 ; 0 = pas de borne.
  high_pass: 15
  low_pass: 0
  # Critère de netteté : TENEGRAD | SUM_OF_VARIANCE | SUM_OF_LAPLACIAN | SUM_OF_INTENSITY |
  #                      SUM_OF_GRADIENT | MEAN_ALL | MEAN_LOG_ALL | VAR_IMAG_OVER_REAL
  #   VAR_IMAG_OVER_REAL : var. locale(Im) / var. locale(Re) du champ complexe reconstruit
  #   (porteuse retirée), pour objets de phase ; fond ≈ 1, sans unité.
  focus_type: TENEGRAD
  # Taille du noyau de sommation du focus (px). Entier > 0.
  sum_size: 11
  # Type de seuil : seuil = centre + nb_std_threshold × dispersion du volume de focus.
  #   STD_VAR : moyenne + n × écart-type (comme HOLOTRACKER). Sensible aux objets eux-mêmes :
  #             leur réponse fait monter l'écart-type, donc le seuil.
  #   MAD     : médiane + n × 1,4826 × MAD (écart absolu médian), estimateurs robustes, peu
  #             sensibles aux voxels forts des objets. Calculé sur 1 pixel sur 4 en x et en y.
  #   MAX_FOCUS : n × voxel max du volume de focus ; n est alors une fraction dans ]0, 1]
  #             (0,5 = moitié du max), de même que auto_nb_std_min / max. Indépendant du fond,
  #             mais lié à l'objet le plus fort du volume.
  #   PEAK_ABOVE_BG : fond (médiane) + n × (voxel max − fond) ; n dans ]0, 1] (0,5 = mi-hauteur
  #             du pic au-dessus du fond). Ne dépend pas du niveau du fond : à utiliser pour comparer
  #             des critères de focus entre eux, avec un seul objet dans le volume.
  #   Les valeurs de nb_std_threshold ne sont pas comparables d'un type à l'autre.
  threshold_type: STD_VAR
  # nb_std_threshold : nombre de dispersions au-dessus du centre. Réel.
  nb_std_threshold: 10.0
  # Seuil cherché automatiquement : true | false.
  #   true  : pour chaque hologramme, on cherche le seuil le plus ÉLEVÉ (en nombre de dispersions (voir threshold_type)
  #           du volume de focus) tel qu'il ne reste QU'UN SEUL objet dans tout le volume et que
  #           cet objet soit apparié à la bactérie. L'unicité est exigée parce qu'en dessous du
  #           seuil limite le volume se remplit de grains de bruit, dont l'un tombe forcément dans
  #           la fenêtre de tolérance et donne un faux appariement.
  #           C'est une mesure directe de la détectabilité ; nb_std_threshold est alors ignoré.
  #           Colonnes ajoutées : nb_std_found (seuil limite) et nb_std_peak (borne donnée par le
  #           pic de focus au voisinage de la bactérie). Coût : ~5 à 10 seuillages par hologramme.
  #   false : seuil fixe nb_std_threshold, comme HOLOTRACKER.
  auto_threshold: false
  # Bornes de la recherche, en nombre de dispersions (voir threshold_type). Réels, min < max.
  #   Sous auto_nb_std_min, la bactérie est déclarée non détectable (nb_std_found vide).
  auto_nb_std_min: 2.0
  auto_nb_std_max: 60.0
  # Précision de la recherche, en nombre de dispersions (voir threshold_type). Réel > 0 (0,25 = ~8 essais).
  auto_precision: 0.25
  # Connectivité 3D : 6 | 18 | 26
  connectivity: 26
  # Filtre sur la taille des objets (voxels). Entiers >= 0 ; 0 = pas de borne.
  min_voxel: 0
  max_voxel: 0

matching:
  # Tolérances d'appariement entre la bactérie simulée et un objet détecté (µm). Réels > 0.
  #   Une bactérie alignée sur l'axe optique donne souvent deux blocs à environ ±4 µm en z :
  #   l'un est apparié, l'autre compté comme doublon.
  tolerance_xy_um: 10.0
  tolerance_z_um: 10.0

run:
  # Répétitions par point (nouveau tirage du bruit à chaque fois). Entier >= 1.
  #   > 1 : moyenne ± écart-type sur les graphes.
  repeats: 1
  # Graine du générateur aléatoire (bruit). Entier. Même graine = mêmes hologrammes.
  seed: 0
  # Afficher les graphes à la fin : true | false (ils sont toujours enregistrés en PNG).
  show_plots: true

output:
  # Dossier de sortie. null : output/stat_report_distance_Z_<date>/ (dossier ignoré par git).
  #   Chemin relatif : par rapport au dossier de ce fichier.
  output_dir: null
  # Enregistrer une image de contrôle par hologramme : true | false. Écrite dans objects/.
  #   Contenu : hologramme nettoyé avec les objets détectés et la bactérie simulée, vue x–z,
  #   et l'erreur de position x, y, z dans le titre. Utile pour comprendre les non-détections ;
  #   à laisser false pour un balayage complet (~0,3 Mo par hologramme).
  save_objects: true
  # Enregistrer l'hologramme et sa référence (TIFF float32) de chaque simulation : true | false.
  #   ~8 Mo par hologramme en 1024².
  save_holograms: false
